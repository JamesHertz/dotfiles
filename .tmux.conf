# change command field ctrl+b to ctrl+space 
# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

set-option -g focus-events

unbind r
bind r source-file ~/.tmux.conf

# trying to solve the problem of neovim
set -sg escape-time 10

# TODO: find a better solution for this
bind-key -n 'C-t' run-shell -b "${HOME}/.local/bin/tmux-toggle-term.sh float"

set-window-option -g mode-keys vi
# # TODO: try to understand what is written below
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind c new-window -c "#{pane_current_path}"

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# status line
set -g status-fg white
set-option -g status-style "bg=default"
set-option -g status-left '#[bg=white fg=black]#(echo "Session: ")#[fg=black]#{session_name}'
set-option -g status-justify centre
set-option -g status-right "#[bg=white fg=black]%a, %d %b %Y %I:%M %p"
# set -g status-right "#[fg=cyan]%A, %d %b %Y %I:%M %p"

# set-option -g status-right '#[bg=white fg=black]#{t:window_activity}'
set-option -g status-interval 1
# set-option -g status-position bottom
# set-option -g status-interval 0
